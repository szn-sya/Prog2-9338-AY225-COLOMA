<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adventurer's Student Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --genshin-gold: #ece5d8;
            --genshin-dark: #3d4a61;
            --genshin-accent: #e0c091;
            --genshin-text: #4a5468;
            --genshin-font: 'Crimson Text', serif;
        }

        body {
            background-color: #1a1c23;
            font-family: var(--genshin-font);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .archive-container {
            background-color: var(--genshin-gold);
            width: 950px;
            padding: 30px;
            border-radius: 12px;
            border: 4px solid var(--genshin-accent);
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 { color: var(--genshin-dark); text-transform: uppercase; letter-spacing: 2px; margin: 0; }

        #txtSearch {
            padding: 8px 15px;
            border-radius: 20px;
            border: 2px solid var(--genshin-accent);
            background: #fffdfa;
            font-family: var(--genshin-font);
        }

        .table-area {
            background: #fffdfa;
            height: 350px;
            overflow-y: auto;
            border: 2px solid var(--genshin-accent);
            border-radius: 8px;
        }

        table { width: 100%; border-collapse: collapse; }
        th { background: var(--genshin-dark); color: white; padding: 12px; position: sticky; top: 0; z-index: 10; }
        td { padding: 10px; text-align: center; border-bottom: 1px solid #e8e0d0; color: var(--genshin-text); }
        
        .editable-grade { cursor: cell; background: #fffcf0; }
        .editable-grade:focus { background: #fff; outline: 2px solid var(--genshin-accent); }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
            padding: 20px;
            background: rgba(0,0,0,0.05);
            border-radius: 8px;
        }

        .input-group { display: flex; justify-content: space-between; align-items: center; }
        .input-group label { font-weight: bold; color: var(--genshin-dark); text-transform: uppercase; font-size: 0.85rem; }
        .input-group input { width: 60%; padding: 8px; border: 1px solid var(--genshin-accent); border-radius: 4px; }

        .button-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 30px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-family: var(--genshin-font);
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .btn-add { background-color: #3e8e41; color: white; }
        .btn-del-main { background-color: #a64444; color: white; }
        .btn-del { background: none; border: none; color: #a64444; font-size: 1.2rem; cursor: pointer; font-weight: bold; }
        .btn:hover { opacity: 0.8; transform: translateY(-1px); }
        
        .user-identity { text-align: right; font-size: 0.8rem; color: var(--genshin-dark); }
    </style>
</head>
<body>

<div class="archive-container">
    <div class="header-row">
        <h1>Student Archive</h1>
        <input type="text" id="txtSearch" placeholder="Search Scholar..." onkeyup="searchTable()">
        <div class="user-identity">
            <div style="font-weight: bold;">Active Traveler</div>
            <span>Coloma Aysberg | UID:25-0771-517</span>
        </div>
    </div>

    <div class="table-area">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th style="text-align:left">Full Name</th>
                    <th>Lab 1</th>
                    <th>Lab 2</th>
                    <th>Lab 3</th>
                    <th>Attendance</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="input-grid">
        <div class="input-group"><label>Student ID</label>
            <input type="text" id="inpID" placeholder="Numbers only" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>
        <div class="input-group"><label>Full Name</label>
            <input type="text" id="inpName" placeholder="Letters only">
        </div>
        <div class="input-group"><label>Lab Work 1</label>
            <input type="number" id="inpL1" min="0" max="100">
        </div>
        <div class="input-group"><label>Lab Work 2</label>
            <input type="number" id="inpL2" min="0" max="100">
        </div>
        <div class="input-group"><label>Lab Work 3</label>
            <input type="number" id="inpL3" min="0" max="100">
        </div>
        <div class="input-group"><label>Attendance</label>
            <input type="number" id="inpAtt" min="0" max="100">
        </div>
    </div>

    <div class="button-row">
        <button class="btn btn-add" onclick="addEntry()">Add Entry</button>
        <button class="btn btn-del-main" onclick="deleteLast()">Remove Last</button>
    </div>
</div>

<script src="DATA.js"></script>
</body>
</html>
